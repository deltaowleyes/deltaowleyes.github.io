name: Shut Your Trap verified photo import
on:
  push:
    branches: [main]
    paths:
      - 'shutyourtrap/photo-inbox/shutyourtrap-photography-pack.zip'
      - 'shutyourtrap/photo-inbox/ONLY-17-PHOTOGRAPHS-JPG.zip'
      - '.github/workflows/shutyourtrap-photo-import.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  group: shut-your-trap-photo-import
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate photo importer Python syntax
        run: python3 -m py_compile shutyourtrap/scripts/import-photo-pack.py shutyourtrap/scripts/import-jpg-photo-pack.py
      - name: Check inbox
        id: inbox
        shell: bash
        run: |
          if test -f shutyourtrap/photo-inbox/ONLY-17-PHOTOGRAPHS-JPG.zip; then
            echo "has_jpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_jpg=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f shutyourtrap/photo-inbox/shutyourtrap-photography-pack.zip || test -f shutyourtrap/photo-inbox/ONLY-17-PHOTOGRAPHS-JPG.zip; then
            echo "has_zip=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
            echo "No photo ZIP uploaded; no changes required."
          fi
      - name: Set up reliable Python runtime for image conversion
        if: steps.inbox.outputs.has_jpg == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion library for verified JPG upload
        if: steps.inbox.outputs.has_jpg == 'true'
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify uploaded JPG photo archive and transcode to 17 WebPs
        if: steps.inbox.outputs.has_jpg == 'true'
        run: python3 shutyourtrap/scripts/import-jpg-photo-pack.py
      - name: Validate existing WebP archive when JPG not uploaded
        if: steps.inbox.outputs.has_zip == 'true' && steps.inbox.outputs.has_jpg != 'true'
        run: python3 shutyourtrap/scripts/import-photo-pack.py
      - name: Install Chromium for pre-publication photo QA
        if: steps.inbox.outputs.has_zip == 'true'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the activated photo site before committing
        if: steps.inbox.outputs.has_zip == 'true'
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/shutyourtrap-photo-qa.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/shutyourtrap/ >/dev/null; then break; fi
            sleep 1
          done
          node shutyourtrap/qa.mjs
      - name: Upload pre-publication photo screenshots and QA results
        if: always() && steps.inbox.outputs.has_zip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shutyourtrap-photo-preflight-qa
          path: shutyourtrap/qa-artifacts/
          if-no-files-found: warn
      - name: Commit verified photo assets and activate photo mode
        if: steps.inbox.outputs.has_zip == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shutyourtrap/assets/photos
          if test -f shutyourtrap/photo-inbox/shutyourtrap-photography-pack.zip; then git rm -f shutyourtrap/photo-inbox/shutyourtrap-photography-pack.zip; fi
          if test -f shutyourtrap/photo-inbox/ONLY-17-PHOTOGRAPHS-JPG.zip; then git rm -f shutyourtrap/photo-inbox/ONLY-17-PHOTOGRAPHS-JPG.zip; fi
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Integrate 17 verified AI photographs into Shut Your Trap site"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No verified changes to commit."
          fi
      - name: Trigger independent post-commit Chromium QA
        if: steps.inbox.outputs.has_zip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run shutyourtrap-qa.yml --ref main
          echo 'Triggered independent browser QA on latest main' >> "$GITHUB_STEP_SUMMARY"
      - name: Request a GitHub Pages rebuild after binary import
        if: steps.inbox.outputs.has_zip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo 'Requested a Pages rebuild after photo import' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Pages rebuild could not be requested automatically; verify and trigger deployment manually.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record no-upload checkpoint
        if: steps.inbox.outputs.has_zip != 'true'
        run: |
          echo 'No ZIP uploaded. Existing SVG site remains unchanged; no photos imported.' >> "$GITHUB_STEP_SUMMARY"
