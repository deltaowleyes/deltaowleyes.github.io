name: BAKE EXPRESS 1.0 Browser QA
on:
  push:
    branches: [feature/bake-express-1-0, main]
    paths:
      - 'deltaexpress/**'
      - '.github/workflows/deltaexpress-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/deltaexpress-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/deltaexpress/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chromium checks at 320, 390, 768, 1440 and inquiry interaction
        run: node deltaexpress/qa.cjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deltaexpress-visual-qa
          path: artifacts/deltaexpress/
          if-no-files-found: warn
          retention-days: 3
