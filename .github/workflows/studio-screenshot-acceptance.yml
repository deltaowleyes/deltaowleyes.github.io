name: Accept public Studio screenshot-only gallery
on:
  push:
    branches: [main]
    paths:
      - 'studio-sandbox/qa_screenshot_galleries.py'
      - '.github/workflows/studio-screenshot-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test public six-gallery navigation, 36 screenshot pages, modal and responsiveness
        run: python studio-sandbox/qa_screenshot_galleries.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-public-screenshot-gallery-acceptance
          path: artifacts/studio-public-screenshots/
          if-no-files-found: warn
