name: Studio six-breakpoint restoration Chromium QA
on:
  push:
    branches: [main]
    paths:
      - 'studio-sandbox/index.html'
      - 'studio-sandbox/previews/**/index.html'
      - 'studio-sandbox/header-*.webp'
      - 'studio-sandbox/reference-40.webp'
      - 'studio-sandbox/header-restoration-manifest.json'
      - 'studio-sandbox/qa_public.py'
      - '.github/workflows/studio-header-qa-local.yml'
  pull_request:
    branches: [main]
    paths:
      - 'studio-sandbox/index.html'
      - 'studio-sandbox/previews/**/index.html'
      - 'studio-sandbox/header-*.webp'
      - 'studio-sandbox/reference-40.webp'
      - 'studio-sandbox/header-restoration-manifest.json'
      - 'studio-sandbox/qa_public.py'
      - '.github/workflows/studio-header-qa-local.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify six responsive headers and capture actual Chromium screenshots
        env:
          STUDIO_BASE: http://127.0.0.1:8765
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-local.log 2>&1 &
          sleep 3
          python studio-sandbox/qa_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-header-six-width-evidence
          path: artifacts/studio-header-recovery/
          if-no-files-found: warn
