name: Momma Made reference layout audit
on:
  push:
    paths:
      - 'mommamade/reference-audit.mjs'
      - '.github/workflows/mommamade-reference-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node mommamade/reference-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mommamade-reference-layouts
          path: mommamade/reference-evidence/
          if-no-files-found: warn
