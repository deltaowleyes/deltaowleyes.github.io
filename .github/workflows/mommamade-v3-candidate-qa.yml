name: Momma Made V3 — Zero-cost candidate quality gate
on:
  push:
    branches: [main]
    paths:
      - 'mommamade/v3/**'
      - 'tests/mommamade-v3.qa.cjs'
      - 'tests/website-factory-cost-guard.cjs'
      - 'tests/mommamade-v3-reference-capture.cjs'
      - 'data/web-design-projects.json'
      - 'data/website-factory-cost-ledger.json'
      - '.github/workflows/mommamade-v3-candidate-qa.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mommamade/v3/**'
      - 'tests/mommamade-v3.qa.cjs'
      - 'tests/website-factory-cost-guard.cjs'
      - 'tests/mommamade-v3-reference-capture.cjs'
      - '.github/workflows/mommamade-v3-candidate-qa.yml'
permissions:
  contents: read
jobs:
  candidate-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static cost and release preflight
        run: node tests/website-factory-cost-guard.cjs
      - name: Install free Playwright test runner
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start isolated local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mommamade-v3-server.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/mommamade/v3/ >/dev/null
      - name: Test ten candidates, 90 routes, 50 breakpoints and imagery
        run: node tests/mommamade-v3.qa.cjs
      - name: Capture inspiration comparisons and explicitly log unavailable sources
        if: always()
        run: node tests/mommamade-v3-reference-capture.cjs
      - name: Candidate-only warning — approval requires human reference comparison
        if: always()
        run: |
          echo "::notice::This is a CANDIDATE check only. A green Chromium test is not reference-fidelity approval or deployment verification."
          echo "::notice::Keep Momma Made V2 current until source screenshot pairs are reviewed and the live site is verified."
      - name: Archive desktop/mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mommamade-v3-candidate-visual-qa
          path: artifacts/mommamade-v3/
          if-no-files-found: ignore
          retention-days: 14
