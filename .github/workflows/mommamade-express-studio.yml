name: Momma Made BAKE EXPRESS canonical screenshot studio
on:
  push:
    branches: [main]
    paths:
      - 'mommamade/studio/build.py'
      - 'mommamade/studio/polish.css'
      - 'mommamade/studio/qa.py'
      - 'mommamade/studio/config.js'
      - 'assets/express-studio/v1/studio.css'
      - 'assets/express-studio/v1/studio.js'
      - '.github/workflows/mommamade-express-studio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mommamade-express-studio-publisher
  cancel-in-progress: false
jobs:
  capture-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and image encoder
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Capture original responsive templates without changing master gallery shell
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/momma-express.log 2>&1 &
          sleep 2
          python mommamade/studio/build.py
      - name: Verify six exact original headers, gallery navigation, previews and keyboard
        run: python mommamade/studio/qa.py
      - name: Publish screenshot data only, never V2/V3 site source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mommamade/studio/screenshot-manifest.json mommamade/studio/previews/
          if ! git diff --cached --quiet; then
            git commit -m "Momma Made: refresh 36 original previews in canonical BAKE EXPRESS shell"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mommamade-bake-express-canonical-qa
          path: |
            mommamade/studio/screenshot-manifest.json
            artifacts/mommamade-shared-studio/
          if-no-files-found: warn
          retention-days: 5
