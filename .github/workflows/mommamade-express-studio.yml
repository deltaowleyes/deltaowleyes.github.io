name: Momma Made BAKE EXPRESS screenshot review studio
on:
  push:
    branches: [main]
    paths:
      - 'mommamade/studio/build.py'
      - '.github/workflows/mommamade-express-studio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mommamade-express-studio-publisher
  cancel-in-progress: false
jobs:
  capture-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated open-source browser and WebP encoder
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Generate actual Momma Made candidate screenshots for six viewports
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/mommamade-studio-http.log 2>&1 &
          sleep 2
          python mommamade/studio/build.py
      - name: Verify exact routes, screenshot files and browser interaction
        run: |
          python - <<'PY'
          import json,pathlib
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('mommamade/studio')
          data=json.loads((root/'screenshot-manifest.json').read_text())
          assert data['status']=='candidate-review-only'
          assert len(data['families'])==6
          assert data['widths']==[320,390,500,768,1024,1440]
          assert 'href="/mommamade/v3/' not in (root/'index.html').read_text()
          for f in data['families']:
              assert len(f['screenshots'])==6
              folder=root/'previews'/f['slug']
              assert (folder/'index.html').exists()
              assert (folder/'thumbnail.webp').exists()
              for s in f['screenshots']:
                  assert (folder/s['file']).stat().st_size>2000
                  assert not s['page_errors']
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for w in data['widths']:
                  page=browser.new_page(viewport={'width':w,'height':900})
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  r=page.goto('http://127.0.0.1:8765/mommamade/studio/',wait_until='networkidle')
                  assert r and r.status==200
                  assert page.locator('.card').count()==6
                  assert not page.evaluate('document.documentElement.scrollWidth > innerWidth + 2'),f'gallery overflow at {w}'
                  assert not errors,errors
                  page.close()
              page=browser.new_page(viewport={'width':390,'height':844})
              r=page.goto('http://127.0.0.1:8765/mommamade/studio/previews/garden-folio/',wait_until='networkidle')
              assert r and r.status==200
              assert page.locator('.shot').count()==6
              page.locator('.shot button').first.click()
              assert page.locator('dialog').evaluate('(d)=>d.open')
              page.keyboard.press('Escape')
              assert not page.locator('dialog').evaluate('(d)=>d.open')
              assert not page.evaluate('document.documentElement.scrollWidth > innerWidth + 2')
              page.close()
              browser.close()
          print('PASS: 6 design pages, 36 screenshot images, six landing widths, dialog/Escape, no direct V3 source links')
          PY
      - name: Commit screenshot-only public review output without promoting V3
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mommamade/studio/index.html mommamade/studio/previews/ mommamade/studio/screenshot-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Momma Made Studio: publish 36 real viewport screenshots for six V3 candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload independent screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mommamade-express-6x6-screen-evidence
          path: |
            mommamade/studio/index.html
            mommamade/studio/screenshot-manifest.json
            mommamade/studio/previews/
          if-no-files-found: warn
          retention-days: 5
