name: Website Factory 2.0 — reviewed candidate Chromium QA
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'factory2/integration-2026-11-05'
      - main
    paths:
      - 'website-factory/**'
      - '.github/workflows/website-factory-candidates.yml'
permissions:
  contents: read
concurrency:
  group: factory2-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  candidate-qa:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free/open-source Chromium test tool
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve checkout (never a deployment)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/factory2-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/mommamade/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Validate isolated candidates or all integrated candidates
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            node website-factory/tests/qa.cjs --all
          else
            node website-factory/tests/qa.cjs --present
          fi
      - name: Save actual desktop/mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-factory-2-visual-qa
          path: website-factory/qa-artifacts/
          if-no-files-found: ignore
          retention-days: 3
