name: Import sourced business batch
on:
  push:
    branches: [main]
    paths:
      - 'indigenous-businesses/imports/*.json'
permissions:
  contents: write
concurrency:
  group: doe-business-directory-import
  cancel-in-progress: false
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import B10 sourced records with alias and status safeguards
        run: python3 scripts/import_directory_batch.py indigenous-businesses/imports/2026-10-31-b10.json
      - name: Validate directory JSON and verification rules
        run: python3 scripts/check_directory_data.py
      - name: Commit only modified directory data
        run: |
          git config user.name "delta-owl-eyes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indigenous-businesses/businesses.json
          if ! git diff --cached --quiet; then
            git commit -m "data: import Ontario sourced B10 business directory batch"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
