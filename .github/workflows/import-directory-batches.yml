name: Import sourced business batch
on:
  push:
    branches: [main]
    paths:
      - 'indigenous-businesses/imports/*.json'
      - '.github/workflows/import-directory-batches.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: doe-directory-data-write
  cancel-in-progress: false
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import sourced batches with alias and status safeguards
        run: |
          for batch in indigenous-businesses/imports/*.json; do
            python3 scripts/import_directory_batch.py "$batch"
          done
      - name: Record newly added directory entries
        run: python3 scripts/record_directory_additions.py --base "$GITHUB_SHA" --run "$GITHUB_SHA" --mode import
      - name: Validate directory JSON and verification rules
        run: python3 scripts/check_directory_data.py
      - name: Commit only modified directory data
        run: |
          git config user.name "delta-owl-eyes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indigenous-businesses/businesses.json data/directory-updates.json
          if ! git diff --cached --quiet; then
            git commit -m "data: import sourced Indigenous business directory batches"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
