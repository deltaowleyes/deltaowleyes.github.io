name: Momma Made layout and route QA
on:
  push:
    paths:
      - 'mommamade/**'
      - '.github/workflows/mommamade-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mommamade-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/mommamade/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test 10 layouts and 40 products
        run: node mommamade/qa.mjs
      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mommamade-visual-qa
          path: mommamade/qa-artifacts/
          if-no-files-found: warn
