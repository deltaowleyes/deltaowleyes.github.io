name: Momma Made 2.0 — visual and interaction quality gate

on:
  push:
    branches: [main]
    paths:
      - 'mommamade/v2/**'
      - 'tests/mommamade-v2.qa.cjs'
      - 'tests/mommamade-reference-capture.cjs'
      - '.github/workflows/mommamade-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-qa:
    name: Ten designs / desktop + mobile Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start isolated static test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mommamade-v2-server.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/mommamade/v2/ >/dev/null
      - name: Test gallery, 10 templates, 91+ routes, forms and breakpoints
        run: node tests/mommamade-v2.qa.cjs
      - name: Capture reference comparison screenshots (explicitly report blocked sources)
        if: always()
        run: node tests/mommamade-reference-capture.cjs
      - name: Archive screenshots and reference comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mommamade-v2-visual-reference-and-qa
          path: artifacts/mommamade-v2/
          if-no-files-found: ignore
          retention-days: 14
