name: Validate BAKE PRO 3.0 roadmap
on:
  push:
    paths:
      - 'data/bake-pro-3-roadmap.json'
      - 'scripts/check_bake_pro_3_roadmap.py'
      - '.github/workflows/validate-bake-pro-3-roadmap.yml'
  pull_request:
    paths:
      - 'data/bake-pro-3-roadmap.json'
      - 'scripts/check_bake_pro_3_roadmap.py'
      - '.github/workflows/validate-bake-pro-3-roadmap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical roadmap identities and provenance
        run: python3 scripts/check_bake_pro_3_roadmap.py
