name: Audit two independent Education PR approvals
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Education PR number to audit (no private case data)"
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  advisory-review-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent current-head review evidence
        run: python3 scripts/check_education_pr_approvals.py --pr "${{ inputs.pull_request }}"
