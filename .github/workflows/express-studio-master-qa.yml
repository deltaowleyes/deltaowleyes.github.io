name: BAKE EXPRESS Master 1.0 — canonical studio acceptance

on:
  push:
    branches:
      - feature/express-studio-master-standard-1-0
      - main
    paths:
      - 'assets/express-studio/v1/**'
      - 'shutyourtrap/express/**'
      - '.github/workflows/express-studio-master-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonical-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve actual repository site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/express-master.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/shutyourtrap/express/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Generate exact six-width real screenshots (feature only)
        if: github.ref_name != 'main'
        run: node shutyourtrap/express/render-shots.cjs
      - name: Verify six canonical headers, 42 routes, 36 screenshots, keyboard and privacy
        run: node assets/express-studio/v1/qa.cjs
      - name: Upload screenshot and browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: express-studio-master-standard-visual-qa
          path: |
            artifacts/express-master-standard/
            shutyourtrap/express/shots/manifest.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish verified image files only to the feature branch
        if: github.ref_name == 'feature/express-studio-master-standard-1-0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shutyourtrap/express/shots/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "visual(express): real six-width Shut Your Trap captures"
            git fetch origin feature/express-studio-master-standard-1-0
            git rebase origin/feature/express-studio-master-standard-1-0
            git push origin HEAD:feature/express-studio-master-standard-1-0
          fi
