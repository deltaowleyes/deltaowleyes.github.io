name: Validate directory data
on:
  push:
    paths:
      - 'indigenous-businesses/**'
      - 'indigenous-churches/**'
      - 'admin/**'
      - 'scripts/test_admin_auth.mjs'
      - 'scripts/test_admin_outreach.mjs'
      - 'scripts/check_directory_data.py'
      - '.github/workflows/validate-directory-data.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 11 * * 1'
permissions:
  contents: read
jobs:
  validate-directories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JSON and verification rules
        run: python3 scripts/check_directory_data.py
      - name: Test encrypted admin connection
        run: node scripts/test_admin_auth.mjs
      - name: Test encrypted outreach notes and call workflow
        run: node scripts/test_admin_outreach.mjs
      - name: Test unified directory creation and publishing safeguards
        run: node scripts/test_admin_creation.mjs
