name: Studio exact-reference gallery browser QA
on:
  push:
    branches:
      - feature/doe-studio-2-redesign-pilot
    paths:
      - 'studio-sandbox/reference/**'
      - 'studio2/tests/exact_gallery_qa.py'
      - '.github/workflows/studio-exact-gallery-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-and-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate actual WebP, six hotspots and responsive viewing
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/exact-studio-http.log 2>&1 &
          sleep 2
          python studio2/tests/exact_gallery_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-reference-six-hotspot-screenshots
          path: artifacts/exact-gallery/
          if-no-files-found: warn
