name: Check internal website links
on:
  push:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/check_internal_links.py'
      - '.github/workflows/check-internal-links.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'
permissions:
  contents: read
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local files and anchors
        run: python3 scripts/check_internal_links.py
