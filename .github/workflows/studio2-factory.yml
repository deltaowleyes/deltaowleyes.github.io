name: DOE Studio 3 Multipage Factory QA
on:
  workflow_dispatch:
  push:
    branches:
      - feature/doe-studio-2-redesign-pilot
    paths:
      - 'studio2/factory/**'
      - '.github/workflows/studio2-factory.yml'
concurrency:
  group: studio3-multipage-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline build and browser tools
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate existing independent photo importer
        run: python studio2/tests/photo_import_contract.py
      - name: Generate WebP images, provenance, and working preview
        run: |
          python studio2/factory/build_three.py
          python studio2/factory/build_multipage.py
      - name: Verify candidate and preserved original pilot in Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-factory-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          python studio2/tests/qa.py
          python studio2/factory/qa.py
          python studio2/factory/qa_three.py
          python studio2/factory/qa_multipage.py
      - name: Preserve non-deployed preview, full-page screenshots and JSON QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doe-studio3-multipage-UNPUBLISHED
          path: |
            studio2/river-voice/factory-preview/
            studio2/factory-previews/
            artifacts/studio2/
            artifacts/studio3/
            artifacts/studio3-three/
            artifacts/studio3-multipage/
          if-no-files-found: warn
# No GITHUB_TOKEN write permission, no merge, no Pages, no paid APIs.
