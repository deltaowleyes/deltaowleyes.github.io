name: Directory Chromium smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test_directory_browser.mjs'
      - 'admin/**'
      - 'indigenous-businesses/index.html'
      - 'indigenous-businesses/profile.html'
      - 'indigenous-businesses/**/*.js'
      - 'indigenous-businesses/**/*.css'
      - 'indigenous-churches/index.html'
      - 'indigenous-churches/**/*.js'
      - 'indigenous-churches/**/*.css'
  pull_request:
    paths:
      - '.github/workflows/test-directory-browser.yml'
      - 'scripts/test_directory_browser.mjs'
      - 'admin/**'
      - 'indigenous-businesses/index.html'
      - 'indigenous-businesses/profile.html'
      - 'indigenous-businesses/**/*.js'
      - 'indigenous-businesses/**/*.css'
      - 'indigenous-churches/index.html'
      - 'indigenous-churches/**/*.js'
      - 'indigenous-churches/**/*.css'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doe-directory-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright library
        run: npm install --no-save --ignore-scripts playwright@1.64.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test public directory, admin forms and mock publishing in real Chromium
        run: node scripts/test_directory_browser.mjs
      - name: Keep failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: directory-chromium-failure
          path: test-results/*.png
          if-no-files-found: ignore
