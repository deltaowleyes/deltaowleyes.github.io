name: Shut Your Trap multi-template browser QA
on:
  push:
    paths:
      - 'shutyourtrap/**'
      - '.github/workflows/shutyourtrap-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/shutyourtrap-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/shutyourtrap/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run 70 routes and 40 assets browser checks
        run: node shutyourtrap/qa.mjs
      - name: Save actual visual QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shutyourtrap-browser-qa
          path: shutyourtrap/qa-artifacts/
          if-no-files-found: warn
