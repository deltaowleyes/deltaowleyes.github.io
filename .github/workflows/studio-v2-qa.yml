name: Studio 2.0 candidate visual acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - 'newdesigns/v2/**'
      - 'scripts/studio-v2-smoke.py'
      - '.github/workflows/studio-v2-qa.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run candidate-only tests
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-v2-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          STUDIO_BASE_URL=http://127.0.0.1:8765 python scripts/studio-v2-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-owl-eyes-studio-2-qa
          path: artifacts/studio-v2/
          if-no-files-found: warn
