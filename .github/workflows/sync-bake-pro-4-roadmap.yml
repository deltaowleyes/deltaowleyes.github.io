name: BAKE PRO 4.0 status reconciliation
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  actions: read
  contents: write
concurrency:
  group: bake-pro-4-status-write
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconcile verifiable GitHub workflow evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_bake_pro_4_roadmap.py
      - name: Validate roadmap
        run: python3 scripts/check_bake_pro_4_roadmap.py
      - name: Commit changed task statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bake-pro-4-roadmap.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: reconcile verified BAKE PRO 4.0 task statuses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
