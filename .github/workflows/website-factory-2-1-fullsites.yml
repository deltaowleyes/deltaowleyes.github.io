name: Factory 2.1 — isolated 10 full-site Chromium QA
on:
  push:
    branches:
      - 'factory2/fullsites-2-1-2026-11-05'
    paths:
      - 'website-factory/**'
      - '.github/workflows/website-factory-2-1-fullsites.yml'
permissions:
  contents: read
concurrency:
  group: factory21-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fullsite-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing production archives and permanent cost policy
        run: |
          node tests/web-design-revisions.qa.cjs
          node tests/website-factory-cost-guard.cjs
      - name: Install no-cost Chromium QA tools on standard runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Start local-only static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/factory21-http.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:8765/mommamade/v2/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Check 60 routes, 360 viewport combinations, 10 navigation systems and demo controls
        run: node website-factory/tests/fullsites.qa.cjs
      - name: Check automated WCAG rules and keyboard skip on 120 viewport/routes
        run: node website-factory/tests/fullsites-a11y.qa.cjs
      - name: Upload genuine screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory21-fullsites-browser-a11y-evidence
          path: website-factory/qa-artifacts/fullsites/
          if-no-files-found: warn
          retention-days: 3
