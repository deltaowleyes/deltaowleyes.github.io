name: Publish verified news records
on:
  push:
    paths:
      - 'news/updates/**'
      - 'tools/build_news.py'
      - '.github/workflows/publish-verified-news.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate records and build news index
        run: python tools/build_news.py
      - name: Commit generated page if changed
        run: |
          if ! git diff --quiet -- news/index.html || [ -n "$(git ls-files --others --exclude-standard news/index.html)" ]; then
            git config user.name "delta-owl-eyes-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news/index.html
            git commit -m "Publish verified news index"
            git push
          fi
