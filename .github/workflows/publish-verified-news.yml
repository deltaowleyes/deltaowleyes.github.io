name: Publish verified news and aggregator feeds
on:
  push:
    paths:
      - 'news/index.html'
      - 'news/updates/**'
      - 'tools/build_news.py'
      - 'tools/publish_news_feeds.py'
      - 'news/publication-dates.json'
      - '.github/workflows/publish-verified-news.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical records and preserve the curated newsroom
        run: python tools/build_news.py
      - name: Generate article pages, RSS and standards-compliant sitemaps
        run: python tools/publish_news_feeds.py
      - name: Commit generated feeds, individual articles, and publishing dates
        run: |
          git add -- news/index.html news/scripts/index.html news/articles news/publication-dates.json feed.xml sitemap.xml news-sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name "delta-owl-eyes-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh canonical news pages and syndication feeds"
            git push
          fi
