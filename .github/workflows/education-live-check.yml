name: Verify live Education Hub
on:
  push:
    branches: [main]
    paths:
      - "education/**"
      - "data/education-resources.json"
      - "index.html"
      - "scripts/check_education_live.py"
      - ".github/workflows/education-live-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify production HTTP, content and navigation
        run: python3 scripts/check_education_live.py
