name: Momma Made BAKE EXPRESS canonical public acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mommamade-express-live-qa.yml'
      - 'mommamade/studio/screenshot-manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Independently verify live canonical gallery, six headers and 36 screenshots
        run: python mommamade/studio/verify_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mommamade-bake-express-live-qa
          path: artifacts/mommamade-shared-studio/
          retention-days: 5
          if-no-files-found: warn
