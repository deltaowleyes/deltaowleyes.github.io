<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/owl-logo.png"><title>Business Profile | Delta Owl Eyes</title><meta name="description" content="Source-reported Indigenous business directory profile, awaiting business confirmation."><style>*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:#193a3a;font:16px/1.65 system-ui,sans-serif}header,footer{background:#f1f6f3;padding:18px 5%;border-bottom:1px solid #d7e5df}nav,main,.foot{max-width:980px;margin:auto}nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}nav img{height:40px;vertical-align:middle;margin-right:10px}a{color:#225e58}nav a{margin-right:12px}main{padding:35px 20px 75px}.banner{width:100%;height:clamp(130px,28vw,300px);object-fit:contain;background:#edf5f0}h1{font:clamp(2rem,5vw,3.2rem) Georgia,serif;line-height:1.2}h2{font:1.65rem Georgia,serif}.muted{color:#536b66}.panel{background:white;border:1px solid #dce7e2;border-radius:10px;padding:24px;margin:22px 0;overflow-wrap:anywhere}.tag{display:inline-block;background:#f6ecd6;color:#654c1d;border-radius:20px;padding:5px 12px;font-size:.84rem;font-weight:700}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.fact{padding:12px 0;border-bottom:1px solid #e4ece7}.fact strong{display:block}.button{display:inline-block;background:#d7aa63;color:#183d3c;text-decoration:none;padding:11px 17px;border-radius:5px;font-weight:700;margin:6px 10px 6px 0}.actions a{margin-right:18px;display:inline-block;margin-bottom:10px}.notice{background:#e9f2ee;border-radius:8px;padding:17px;margin:20px 0}</style></head><body><header><nav><div><a href="/"><img src="/assets/owl-logo.png" alt=""><strong>DELTA OWL EYES</strong></a></div><div><a href="/">Home</a><a href="/calls-to-action/">94 Calls to Action</a><a href="/indigenous-businesses/">Business Directory</a></div></nav></header><img class="banner" src="/assets/hero.png" alt="Delta Owl Eyes banner"><main><p><a href="./">← Back to Indigenous Business Directory</a></p><p class="muted">Hard Truths. Education. Accountability.</p><div id="profile"><p>Loading business profile…</p></div></main><footer><div class="foot">© Delta Owl Eyes · <a href="/">Home</a> · Hard Truths. Education. Accountability.</div></footer><script>
const root=document.getElementById('profile'),key=new URLSearchParams(location.search).get('business');
function el(tag,text,parent,cls){const e=document.createElement(tag);if(text!==null)e.textContent=text;if(cls)e.className=cls;if(parent)parent.append(e);return e}
function link(label,url,parent){if(!url||!(/^(https:\/\/|mailto:|tel:)/i.test(url)))return;const a=el('a',label,parent);a.href=url;if(url.startsWith('https://')){a.target='_blank';a.rel='noopener noreferrer'}return a}
Promise.all(['./businesses.json','./ontario-businesses.json'].map(path=>fetch(path).then(r=>{if(!r.ok)throw Error();return r.json()}))).then(groups=>groups.flat()).then(data=>{const b=data.find(x=>x.name+'|'+x.city===key);root.replaceChildren();if(!b){el('h1','Business profile not found',root);el('p','This profile may have been updated or removed. Please return to the directory.',root);return}document.title=b.name+' | Delta Owl Eyes Indigenous Business Directory';el('h1',b.name,root);el('span',b.owner_confirmed?'Owner-confirmed':'Unverified — awaiting business confirmation',root,'tag');el('p','This profile uses source-reported information. Details may be outdated and have not been confirmed directly with the business.',root,'notice');if(b.description){const p=el('section',null,root,'panel');el('h2','About this business',p);el('p',b.description,p)}const box=el('section',null,root,'panel');el('h2','Business details',box);const facts=el('div',null,box,'facts');for(const [label,value] of [['Industry',b.category],['Street address',b.address],['City',b.city],['Province / territory',b.province],['Postal code',b.postal_code],['Community affiliation (only when documented)',b.community],['Region',b.region],['Ownership structure (source-reported)',b.ownership_type],['Year formed (source-reported)',b.year_formed],['Source last updated',b.source_updated]]){if(!value)continue;const d=el('div',null,facts,'fact');el('strong',label,d);el('span',value,d)}const links=el('section',null,root,'panel');el('h2','Contact and links',links);const acts=el('div',null,links,'actions');link('Visit business website',b.website,acts);link('Call business',b.phone?'tel:'+b.phone.replace(/[^+0-9]/g,''):null,acts);link('Facebook page',b.facebook,acts);if(b.phone)el('p','Phone: '+b.phone,links);if(b.address||b.city){const address=[b.address,b.city,b.province,b.postal_code].filter(Boolean).join(', ');link('View location on Google Maps','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address),acts)}const source=el('section',null,root,'panel');el('h2','Sources and accuracy',source);el('p','Business details were imported from a publicly available dataset. Inclusion is not proof of current operating status, and source-reported Indigenous ownership is not the same as direct business confirmation.',source);link('View original data source',b.source_url,source);const claim=el('section',null,root,'notice');el('h2','Own or represent this business?',claim);el('p','Claim this listing, request a correction or removal, or provide updated contact information. Basic listings are free.',claim);const mail='mailto:deltaowleyes@gmail.com?subject='+encodeURIComponent('Business listing claim or correction: '+b.name+' ('+b.city+')');const button=link('Claim or correct this listing',mail,claim);if(button)button.className='button';el('p','Email: deltaowleyes@gmail.com',claim)}).catch(()=>{root.replaceChildren();el('h1','Profile temporarily unavailable',root);el('p','Please try again later.',root)});
</script></body></html>
