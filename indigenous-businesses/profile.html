e-bar" aria-label="Delta Owl Eyes motto">HARD TRUTHS. &nbsp; EDUCATION. &nbsp; ACCOUNTABILITY.</div><main id="root"><h1>Loading profile…</h1></main><footer></footer><script>const root=document.getElementById('root'),key=new URLSearchParams(location.search).get('business');function add(tag,txt,parent){let e=document.createElement(tag);if(txt)e.textContent=txt;parent.append(e);return e}function link(label,url,parent){if(!url||!(/^(https:\/\/|mailto:|tel:)/i.test(url)))return;let a=add('a',label,parent);a.href=url;if(url.startsWith('https://')){a.target='_blank';a.rel='noopener noreferrer'}return a}Promise.all(['./businesses.json','./ontario-businesses.json','./federal-businesses.json'].map(p=>fetch(p).then(r=>{if(!r.ok)throw Error();return r.json()}))).then(groups=>{let b=groups.flat().find(x=>(x.source_id?'id:'+x.source_id:null)===key||x.name+'|'+x.city===key);root.replaceChildren();if(!b){add('h1','Profile not found',root);return}document.title=b.name+' | Delta Owl Eyes';add('h1',b.name,root);let t=add('span',b.owner_confirmed?'Owner-confirmed':'Unverified — awaiting business confirmation',root);t.className='tag';add('p','Public source-reported information; current details and operating status have not been confirmed directly.',root);let s=add('section',null,root);add('h2','About this business',s);add('p',b.description||'Description not yet provided.',s);s=add('section',null,root);add('h2','Business details',s);let dl=add('dl',null,s);for(let [k,v] of [['Category',b.category],['Community',b.community],['Address',b.address],['City',b.city],['Province or territory',b.province],['Postal code',b.postal_code],['Phone',b.phone],['Source last updated',b.source_updated]]){if(!v)continue;add('dt',k,dl);add('dd',v,dl)}s=add('section',null,root);add('h2','Links and sources',s);for(let [label,url] of [['Business website',b.website],['Original directory profile',b.source_url],['Phone',b.phone?'tel:'+b.phone.replace(/[^+0-9]/g,''):null]]){let l=link(label,url,s);if(l)add('p','',s)}s=add('section',null,root);add('h2','Claim or correct this listing',s);add('p','Basic listings are free. Contact Delta Owl Eyes to verify, correct or remove information.',s);link('Email deltaowleyes@gmail.com','mailto:deltaowleyes@gmail.com?subject='+encodeURIComponent('Listing correction: '+b.name),s)}).catch(()=>{root.textContent='Unable to load business profile data.'});</script></body></html>
