<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/owl-logo.png"><title>Business profile | Delta Owl Eyes</title><style>body{font:17px/1.65 system-ui;background:#fbfaf6;color:#193a3a;margin:0}header,footer{background:#f1f6f3;padding:20px 5%}main{max-width:860px;margin:auto;padding:30px 20px}h1,h2{font-family:Georgia,serif}section{background:white;border:1px solid #dce7e2;padding:22px;margin:20px 0;border-radius:9px}a{color:#205e57}.tag{background:#f6ecd6;padding:6px 12px;border-radius:20px}.banner{display:block;width:100%;height:clamp(130px,27vw,300px);object-fit:contain;background:#edf5f0}dt{font-weight:700}dd{margin:0 0 12px}</style><style id="doe-shared-header">.doe-header{background:#f1f6f3;color:#193a3a;padding:0 5%;font:600 15px/1.4 system-ui,sans-serif}.doe-nav{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:13px 0}.doe-brand{display:inline-flex;align-items:center;gap:9px;color:#193a3a!important;text-decoration:none!important;white-space:nowrap;font-weight:800;letter-spacing:.04em}.doe-brand img{width:38px;height:38px;object-fit:contain}.doe-brand span{color:#986b27}.doe-links{display:flex;flex-wrap:wrap;gap:8px 18px}.doe-links a{color:#193a3a!important;text-decoration:none!important;font-weight:600}.doe-links a:hover,.doe-links a:focus-visible{text-decoration:underline!important}@media(max-width:700px){.doe-nav{justify-content:center}.doe-links{justify-content:center;font-size:13px;gap:10px 14px}}</style></head><body><header class="doe-header"><nav class="doe-nav" aria-label="Main navigation"><a class="doe-brand" href="/"><img src="/assets/owl-logo.png" alt="Delta Owl Eyes logo">DELTA <span>OWL</span> EYES</a><div class="doe-links"><a href="/#investigations">Investigations</a><a href="/news/">News Updates</a><a href="/calls-to-action/">94 Calls to Action</a><a href="/indigenous-businesses/">Indigenous Businesses</a><a href="/#culture">Culture</a><a href="/#about">About</a></div></nav></header><img class="banner" src="/assets/hero.png" alt="Delta Owl Eyes banner"><main id="root"><h1>Loading profile…</h1></main><footer>Hard Truths. Education. Accountability.</footer><script>const root=document.getElementById('root'),key=new URLSearchParams(location.search).get('business');function add(tag,txt,parent){let e=document.createElement(tag);if(txt)e.textContent=txt;parent.append(e);return e}function link(label,url,parent){if(!url||!(/^(https:\/\/|mailto:|tel:)/i.test(url)))return;let a=add('a',label,parent);a.href=url;if(url.startsWith('https://')){a.target='_blank';a.rel='noopener noreferrer'}return a}Promise.all(['./businesses.json','./ontario-businesses.json','./federal-businesses.json'].map(p=>fetch(p).then(r=>{if(!r.ok)throw Error();return r.json()}))).then(groups=>{let b=groups.flat().find(x=>(x.source_id?'id:'+x.source_id:null)===key||x.name+'|'+x.city===key);root.replaceChildren();if(!b){add('h1','Profile not found',root);return}document.title=b.name+' | Delta Owl Eyes';add('h1',b.name,root);let t=add('span',b.owner_confirmed?'Owner-confirmed':'Unverified — awaiting business confirmation',root);t.className='tag';add('p','Public source-reported information; current details and operating status have not been confirmed directly.',root);let s=add('section',null,root);add('h2','About this business',s);add('p',b.description||'Description not yet provided.',s);s=add('section',null,root);add('h2','Business details',s);let dl=add('dl',null,s);for(let [k,v] of [['Category',b.category],['Community',b.community],['Address',b.address],['City',b.city],['Province or territory',b.province],['Postal code',b.postal_code],['Phone',b.phone],['Source last updated',b.source_updated]]){if(!v)continue;add('dt',k,dl);add('dd',v,dl)}s=add('section',null,root);add('h2','Links and sources',s);for(let [label,url] of [['Business website',b.website],['Original directory profile',b.source_url],['Phone',b.phone?'tel:'+b.phone.replace(/[^+0-9]/g,''):null]]){let l=link(label,url,s);if(l)add('p','',s)}s=add('section',null,root);add('h2','Claim or correct this listing',s);add('p','Basic listings are free. Contact Delta Owl Eyes to verify, correct or remove information.',s);link('Email deltaowleyes@gmail.com','mailto:deltaowleyes@gmail.com?subject='+encodeURIComponent('Listing correction: '+b.name),s)}).catch(()=>{root.textContent='Unable to load business profile data.'});</script></body></html>
